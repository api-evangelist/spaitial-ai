aid: spaitial-ai
name: SpAItial
description: >-
  SpAItial is a frontier AI lab building physically-grounded world models. Its
  Echo model turns a single image, a 360-degree panorama, or a text prompt into
  a persistent, explorable 3D Gaussian Splat world. The SpAItial Developer API
  is a REST interface for generating, editing, exporting, and downloading these
  3D worlds programmatically. Generation is asynchronous (submit a job, then poll
  or receive a webhook), authenticated with bearer API keys carrying explicit
  scopes, metered in credits, protected by per-key rate limits and an
  Idempotency-Key contract, and fully agent-ready through a hosted Model Context
  Protocol (MCP) server and a published Agent Skill.
